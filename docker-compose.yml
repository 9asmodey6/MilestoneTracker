version: '3.8'

services:
  milestone-tracker-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: milestone_tracker_api
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=milestones;Username=postgres;Password=postgres
      # Раскомментируйте и добавьте токен вашего бота для запуска в Docker:
      # - Telegram__BotToken=ВАШ_ТОКЕН_ЗДЕСЬ
    depends_on:
      - postgres
    networks:
      - milestone_network

  postgres:
    image: postgres:15-alpine
    container_name: milestone_tracker_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: milestones
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - milestone_network

volumes:
  pgdata:

networks:
  milestone_network:
    driver: bridge
